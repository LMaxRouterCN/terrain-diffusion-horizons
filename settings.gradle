// Terrain Diffusion Horizons - 单项目扁平结构 (仅 Forge 1.20.1)
// 配方移植自 LMaxs Terrain Diffusion fork versions/1.20.1/settings.gradle, 删 fabric/sponge (无 loom 无 mixin)
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'terrain-diffusion-horizons'